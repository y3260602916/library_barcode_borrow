# ======================================
# 服务端口配置
# ======================================
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ======================================
# MySQL 数据库配置
# ======================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/library_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
spring.datasource.username=root
spring.datasource.password=你的数据库密码

# ======================================
# 文件上传配置
# ======================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ======================================
# Python AI 模块路径配置
# ======================================
# Python 解释器路径，改为你本机的 python 路径
python.python-path=python
# main.py 脚本的绝对路径，改为你本机的实际路径
python.script-path=D:/library_barcode_borrow/ai-model/main.py

# ======================================
# MyBatis 配置
# ======================================
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# ======================================
# 日志配置
# ======================================
logging.level.com.campus.libraryborrowbackend.util.PythonUtil=debug
